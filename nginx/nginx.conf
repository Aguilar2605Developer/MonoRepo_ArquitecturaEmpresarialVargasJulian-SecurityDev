worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11;

    server {
        listen 80;

        location / {
            default_type text/plain;
            return 200 "Reverse proxy activo. Rutas disponibles: /securitydev, /users y /pgadmin\n";
        }

        location /securitydev/ {
            proxy_pass http://securitydev-backend:8080/;
            include /etc/nginx/proxy_headers.conf;
        }

        location /users/ {
            proxy_pass http://users-microservice:8686/;
            include /etc/nginx/proxy_headers.conf;
        }

        # Redirect explícito para /pgadmin (sin barra) -> preserva host+puerto siempre.
        # Coincidencia exacta (=) tiene prioridad sobre el location con prefijo de abajo.
        location = /pgadmin {
            return 301 $scheme://$http_host/pgadmin/;
        }

        # Explorador de BD (Criterio 3): nunca expuesto con su propio
        # ports:, solo accesible detrás del reverse proxy.
        location /pgadmin/ {
            proxy_pass http://pgadmin:80/pgadmin/;
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header X-Script-Name /pgadmin;
        }
    }
}